<svg xmlns="http://www.w3.org/2000/svg" width="840" height="405" viewBox="0 0 840 405" role="img" aria-labelledby="title desc"><title id="title">Compute 7 to the power 13 modulo 19</title><desc id="desc">Read exponent 13 from low-order bits to high-order bits: 1, 0, 1, 1. The running powers are 7, 11, 7, 11; the results after each bit are 7, 7, 11, 7.</desc><rect width="840" height="405" rx="16" fill="#f4f8f4"/><g font-family="system-ui, sans-serif" fill="#193b36">
<text x="30" y="36" font-size="23" font-weight="700">13 = 8 + 4 + 1 = (1101)₂</text>
<text x="30" y="70" font-size="17" >Process low-order bits first. All calculations below are modulo 19.</text>
<text x="85" y="112" font-size="16" text-anchor="middle" font-weight="700">Position</text>
<text x="235" y="112" font-size="16" text-anchor="middle" font-weight="700">Bit</text>
<text x="405" y="112" font-size="16" text-anchor="middle" font-weight="700">Running power</text>
<text x="655" y="112" font-size="16" text-anchor="middle" font-weight="700">Result after bit</text>
<g data-position="0" data-bit="1" data-power="7" data-result="7"><rect x="30" y="128" width="780" height="40" rx="6" fill="#e0ede3"/>
<text x="85" y="155" font-size="18" text-anchor="middle">0</text>
<text x="235" y="155" font-size="18" text-anchor="middle">1</text>
<text x="405" y="155" font-size="18" text-anchor="middle">7</text>
<text x="655" y="155" font-size="18" text-anchor="middle">7</text>
</g>
<g data-position="1" data-bit="0" data-power="11" data-result="7"><rect x="30" y="177" width="780" height="40" rx="6" fill="#eceeeb"/>
<text x="85" y="204" font-size="18" text-anchor="middle">1</text>
<text x="235" y="204" font-size="18" text-anchor="middle">0</text>
<text x="405" y="204" font-size="18" text-anchor="middle">11</text>
<text x="655" y="204" font-size="18" text-anchor="middle">7  (skip factor)</text>
</g>
<g data-position="2" data-bit="1" data-power="7" data-result="11"><rect x="30" y="226" width="780" height="40" rx="6" fill="#e0ede3"/>
<text x="85" y="253" font-size="18" text-anchor="middle">2</text>
<text x="235" y="253" font-size="18" text-anchor="middle">1</text>
<text x="405" y="253" font-size="18" text-anchor="middle">7</text>
<text x="655" y="253" font-size="18" text-anchor="middle">11</text>
</g>
<g data-position="3" data-bit="1" data-power="11" data-result="7"><rect x="30" y="275" width="780" height="40" rx="6" fill="#e0ede3"/>
<text x="85" y="302" font-size="18" text-anchor="middle">3</text>
<text x="235" y="302" font-size="18" text-anchor="middle">1</text>
<text x="405" y="302" font-size="18" text-anchor="middle">11</text>
<text x="655" y="302" font-size="18" text-anchor="middle">7</text>
</g>
<text x="30" y="355" font-size="21" font-weight="700">Selected residues: 7·7·11 ≡ 11·11 ≡ 7 (mod 19)</text>
<text x="30" y="386" font-size="16" >Square the power every step; multiply into the result only for a 1 bit.</text>
</g></svg>
