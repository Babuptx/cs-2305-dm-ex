<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
  <title>Strong induction: split a hexagon</title>
  <desc>The diagonal AD splits hexagon ABCDEF into quadrilaterals ABCD and ADEF. Dotted diagonals AC and AE triangulate the two quadrilaterals into four triangles.</desc>
  <rect width="760" height="360" fill="#f1f4ef"/>
  <path d="M75 170L155 65L305 65L385 170Z" fill="#dce9df"/>
  <path d="M75 170L385 170L305 280L155 280Z" fill="#e9e2d1"/>
  <path d="M75 170L155 65L305 65L385 170L305 280L155 280Z" fill="none" stroke="#20322f" stroke-width="3"/>
  <path d="M75 170H385" stroke="#246451" stroke-width="4"/>
  <path d="M75 170L305 65M75 170L305 280" fill="none" stroke="#61716a" stroke-width="2" stroke-dasharray="7 6"/>
  <g fill="#20322f" font-family="system-ui, sans-serif" font-size="22">
    <text x="48" y="178">A</text><text x="143" y="48">B</text><text x="301" y="48">C</text>
    <text x="399" y="178">D</text><text x="301" y="312">E</text><text x="143" y="312">F</text>
    <text x="457" y="101" font-weight="600">6 original sides</text>
    <text x="457" y="153">4 + 4 = 6 + 2</text>
    <text x="457" y="209">2 + 2 = 4 triangles</text>
    <text x="457" y="264" font-size="18">AD is counted in</text>
    <text x="457" y="290" font-size="18">both smaller boundaries.</text>
  </g>
</svg>
