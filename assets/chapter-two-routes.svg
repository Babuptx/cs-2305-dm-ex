<svg xmlns="http://www.w3.org/2000/svg" width="840" height="370" viewBox="0 0 840 370" role="img" aria-labelledby="title desc">
  <title id="title">Learners reach skills through workshops</title>
  <desc id="desc">Ava joins P and Q. Ben joins Q. Cy joins P. P teaches X; Q teaches X and Y. Ava has two routes to X, but Boolean multiplication records a single yes.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#617c78"/></marker></defs>
  <rect width="840" height="370" rx="16" fill="#f4f8f4"/>
  <g font-family="system-ui, sans-serif" fill="#193b36">
    <text x="42" y="36" font-size="20" font-weight="700">One model, two questions</text>
    <text x="105" y="77" text-anchor="middle" font-size="15">Learners</text>
    <text x="420" y="77" text-anchor="middle" font-size="15">Workshops</text>
    <text x="735" y="77" text-anchor="middle" font-size="15">Skills</text>
    <g stroke="#617c78" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <path data-from="Ava" data-to="P" d="M165 115 L360 145"/>
      <path data-from="Ava" data-to="Q" d="M165 115 L360 235"/>
      <path data-from="Ben" data-to="Q" d="M165 190 L360 235"/>
      <path data-from="Cy" data-to="P" d="M165 265 L360 145"/>
      <path data-from="P" data-to="X" d="M480 145 L675 145"/>
      <path data-from="Q" data-to="X" d="M480 235 L675 145"/>
      <path data-from="Q" data-to="Y" d="M480 235 L675 235"/>
    </g>
    <g fill="#ffffff" stroke="#87a69a" stroke-width="1.5">
      <rect x="45" y="93" width="120" height="44" rx="9"/>
      <rect x="45" y="168" width="120" height="44" rx="9"/>
      <rect x="45" y="243" width="120" height="44" rx="9"/>
      <rect x="360" y="123" width="120" height="44" rx="9"/>
      <rect x="360" y="213" width="120" height="44" rx="9"/>
      <rect x="675" y="123" width="120" height="44" rx="9"/>
      <rect x="675" y="213" width="120" height="44" rx="9"/>
    </g>
    <g text-anchor="middle" font-size="18" font-weight="650">
      <text x="105" y="121">Ava</text><text x="105" y="196">Ben</text><text x="105" y="271">Cy</text>
      <text x="420" y="151">P</text><text x="420" y="241">Q</text>
      <text x="735" y="151">X</text><text x="735" y="241">Y</text>
    </g>
    <rect x="30" y="308" width="780" height="42" rx="9" fill="#e3ede5"/>
    <text x="420" y="335" text-anchor="middle" font-size="16">Ava → X: ordinary product = 2 routes · Boolean product = 1 (yes)</text>
  </g>
</svg>
