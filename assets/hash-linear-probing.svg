<svg xmlns="http://www.w3.org/2000/svg" width="840" height="385" viewBox="0 0 840 385" role="img" aria-labelledby="title desc"><title id="title">Linear probing wraps to the beginning</title><desc id="desc">Keys 19,26,33,12 all hash to slot 5 modulo 7. In insertion order they occupy slots 5,6,0,1.</desc><rect width="840" height="385" rx="16" fill="#f4f8f4"/><g font-family="system-ui, sans-serif" fill="#193b36">
<text x="30" y="36" font-size="23" font-weight="700">Same home location; different final slots</text>
<text x="30" y="70" font-size="17" >Insert 19, 26, 33, 12 into a table of size 7. Each starts at h(k) = 5.</text>
<g data-slot="0" data-key="33">
<text x="80" y="108" font-size="16" text-anchor="middle">slot 0</text>
<rect x="30" y="120" width="100" height="56" rx="7" fill="#cee5d6"/>
<text x="80" y="155" font-size="20" text-anchor="middle">33</text>
</g>
<g data-slot="1" data-key="12">
<text x="192" y="108" font-size="16" text-anchor="middle">slot 1</text>
<rect x="142" y="120" width="100" height="56" rx="7" fill="#cee5d6"/>
<text x="192" y="155" font-size="20" text-anchor="middle">12</text>
</g>
<g data-slot="2" data-key="empty">
<text x="304" y="108" font-size="16" text-anchor="middle">slot 2</text>
<rect x="254" y="120" width="100" height="56" rx="7" fill="#e1e9e2"/>
<text x="304" y="155" font-size="20" text-anchor="middle">empty</text>
</g>
<g data-slot="3" data-key="empty">
<text x="416" y="108" font-size="16" text-anchor="middle">slot 3</text>
<rect x="366" y="120" width="100" height="56" rx="7" fill="#e1e9e2"/>
<text x="416" y="155" font-size="20" text-anchor="middle">empty</text>
</g>
<g data-slot="4" data-key="empty">
<text x="528" y="108" font-size="16" text-anchor="middle">slot 4</text>
<rect x="478" y="120" width="100" height="56" rx="7" fill="#e1e9e2"/>
<text x="528" y="155" font-size="20" text-anchor="middle">empty</text>
</g>
<g data-slot="5" data-key="19">
<text x="640" y="108" font-size="16" text-anchor="middle">slot 5</text>
<rect x="590" y="120" width="100" height="56" rx="7" fill="#cee5d6"/>
<text x="640" y="155" font-size="20" text-anchor="middle">19</text>
</g>
<g data-slot="6" data-key="26">
<text x="752" y="108" font-size="16" text-anchor="middle">slot 6</text>
<rect x="702" y="120" width="100" height="56" rx="7" fill="#cee5d6"/>
<text x="752" y="155" font-size="20" text-anchor="middle">26</text>
</g>
<text x="30" y="216" font-size="18" >19: 5     ·     26: 5 → 6     ·     33: 5 → 6 → 0     ·     12: 5 → 6 → 0 → 1</text>
<text x="30" y="263" font-size="18" font-weight="650">Next key 40 follows 5 → 6 → 0 → 1 → 2, then occupies slot 2.</text>
<text x="30" y="308" font-size="17" >Compare full keys along the probe path. A hash value is not an identity.</text>
<text x="30" y="347" font-size="17" >Stop after at most 7 probes: a full table must not cause an endless loop.</text>
</g></svg>
