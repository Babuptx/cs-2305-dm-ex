<svg xmlns="http://www.w3.org/2000/svg" width="840" height="455" viewBox="0 0 840 455" role="img" aria-labelledby="title desc">
<title id="title">Endpoint conventions for floor and ceiling</title><desc id="desc">The floor graph has closed left endpoints and open right endpoints. The ceiling graph has open left endpoints and closed right endpoints. Steps around negative and nonnegative inputs show the jumps at integers.</desc>
<rect width="840" height="455" rx="16" fill="#f5f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#17324d">
<text x="420" y="34" font-size="22" font-weight="700" text-anchor="middle">Floor and ceiling include opposite ends of a step</text><g transform="translate(25 58)"><rect width="380" height="340" rx="12" fill="white" stroke="#b8c8d5"/><text x="190" y="28" font-size="22" font-weight="600" text-anchor="middle">Floor: y = ⌊x⌋</text><path d="M 42 205 H 286 M 125 286 V 55" fill="none" stroke="#8b9eaf"/><text x="300" y="211" font-size="16" font-weight="400" text-anchor="middle">x</text><text x="125" y="49" font-size="16" font-weight="400" text-anchor="middle">y</text><path d="M 60 201 v 8 M 121 270 h 8" stroke="#8b9eaf"/><text x="60" y="227" font-size="13" font-weight="400" text-anchor="middle">-1</text><text x="108" y="275" font-size="13" font-weight="400" text-anchor="middle">-1</text><path d="M 125 201 v 8 M 121 205 h 8" stroke="#8b9eaf"/><text x="125" y="227" font-size="13" font-weight="400" text-anchor="middle">0</text><text x="108" y="210" font-size="13" font-weight="400" text-anchor="middle">0</text><path d="M 190 201 v 8 M 121 140 h 8" stroke="#8b9eaf"/><text x="190" y="227" font-size="13" font-weight="400" text-anchor="middle">1</text><text x="108" y="145" font-size="13" font-weight="400" text-anchor="middle">1</text><path d="M 255 201 v 8 M 121 75 h 8" stroke="#8b9eaf"/><text x="255" y="227" font-size="13" font-weight="400" text-anchor="middle">2</text><text x="108" y="80" font-size="13" font-weight="400" text-anchor="middle">2</text><g data-left="-1" data-level="-1" data-includes="left"><line x1="60" y1="270" x2="125" y2="270" stroke="#276d60" stroke-width="4"/><circle cx="60" cy="270" r="5" fill="#276d60" stroke="#276d60" stroke-width="2"/><circle cx="125" cy="270" r="5" fill="white" stroke="#276d60" stroke-width="2"/></g><g data-left="0" data-level="0" data-includes="left"><line x1="125" y1="205" x2="190" y2="205" stroke="#276d60" stroke-width="4"/><circle cx="125" cy="205" r="5" fill="#276d60" stroke="#276d60" stroke-width="2"/><circle cx="190" cy="205" r="5" fill="white" stroke="#276d60" stroke-width="2"/></g><g data-left="1" data-level="1" data-includes="left"><line x1="190" y1="140" x2="255" y2="140" stroke="#276d60" stroke-width="4"/><circle cx="190" cy="140" r="5" fill="#276d60" stroke="#276d60" stroke-width="2"/><circle cx="255" cy="140" r="5" fill="white" stroke="#276d60" stroke-width="2"/></g><text x="190" y="314" font-size="18" font-weight="600" text-anchor="middle">⌊x⌋ = 0 on [0, 1)</text></g><g transform="translate(435 58)"><rect width="380" height="340" rx="12" fill="white" stroke="#b8c8d5"/><text x="190" y="28" font-size="22" font-weight="600" text-anchor="middle">Ceiling: y = ⌈x⌉</text><path d="M 42 205 H 286 M 125 286 V 55" fill="none" stroke="#8b9eaf"/><text x="300" y="211" font-size="16" font-weight="400" text-anchor="middle">x</text><text x="125" y="49" font-size="16" font-weight="400" text-anchor="middle">y</text><path d="M 60 201 v 8 M 121 270 h 8" stroke="#8b9eaf"/><text x="60" y="227" font-size="13" font-weight="400" text-anchor="middle">-1</text><text x="108" y="275" font-size="13" font-weight="400" text-anchor="middle">-1</text><path d="M 125 201 v 8 M 121 205 h 8" stroke="#8b9eaf"/><text x="125" y="227" font-size="13" font-weight="400" text-anchor="middle">0</text><text x="108" y="210" font-size="13" font-weight="400" text-anchor="middle">0</text><path d="M 190 201 v 8 M 121 140 h 8" stroke="#8b9eaf"/><text x="190" y="227" font-size="13" font-weight="400" text-anchor="middle">1</text><text x="108" y="145" font-size="13" font-weight="400" text-anchor="middle">1</text><path d="M 255 201 v 8 M 121 75 h 8" stroke="#8b9eaf"/><text x="255" y="227" font-size="13" font-weight="400" text-anchor="middle">2</text><text x="108" y="80" font-size="13" font-weight="400" text-anchor="middle">2</text><g data-left="-1" data-level="0" data-includes="right"><line x1="60" y1="205" x2="125" y2="205" stroke="#276d60" stroke-width="4"/><circle cx="60" cy="205" r="5" fill="white" stroke="#276d60" stroke-width="2"/><circle cx="125" cy="205" r="5" fill="#276d60" stroke="#276d60" stroke-width="2"/></g><g data-left="0" data-level="1" data-includes="right"><line x1="125" y1="140" x2="190" y2="140" stroke="#276d60" stroke-width="4"/><circle cx="125" cy="140" r="5" fill="white" stroke="#276d60" stroke-width="2"/><circle cx="190" cy="140" r="5" fill="#276d60" stroke="#276d60" stroke-width="2"/></g><g data-left="1" data-level="2" data-includes="right"><line x1="190" y1="75" x2="255" y2="75" stroke="#276d60" stroke-width="4"/><circle cx="190" cy="75" r="5" fill="white" stroke="#276d60" stroke-width="2"/><circle cx="255" cy="75" r="5" fill="#276d60" stroke="#276d60" stroke-width="2"/></g><text x="190" y="314" font-size="18" font-weight="600" text-anchor="middle">⌈x⌉ = 1 on (0, 1]</text></g><text x="420" y="432" font-size="16" font-weight="400" text-anchor="middle">Filled dot: included. Open dot: excluded. Selected steps are shown.</text>
</g></svg>
