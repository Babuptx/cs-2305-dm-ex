<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" role="img" aria-labelledby="title desc"><title id="title">Euclidean remainders preserve the gcd</title><desc id="desc">The pairs shrink from 240 and 174 to 6 and 0. Each replacement preserves gcd 6, and the last nonzero remainder is returned.</desc><rect width="840" height="440" rx="16" fill="#f4f8f4"/><g font-family="system-ui, sans-serif" fill="#193b36">
<text x="30" y="36" font-size="23" font-weight="700">Same gcd, smaller numbers</text>
<text x="30" y="70" font-size="18" >Replace (a, b) with (b, a mod b).</text>
<g data-a="240" data-b="174" data-q="1" data-r="66"><rect x="30" y="93" width="780" height="36" rx="6" fill="#e0ede3"/>
<text x="50" y="118" font-size="19" >(240, 174)</text>
<text x="240" y="118" font-size="19" >240 = 174·1 + 66</text>
<text x="555" y="118" font-size="19" >next: (174, 66)</text>
</g>
<g data-a="174" data-b="66" data-q="2" data-r="42"><rect x="30" y="136" width="780" height="36" rx="6" fill="#ffffff"/>
<text x="50" y="161" font-size="19" >(174, 66)</text>
<text x="240" y="161" font-size="19" >174 = 66·2 + 42</text>
<text x="555" y="161" font-size="19" >next: (66, 42)</text>
</g>
<g data-a="66" data-b="42" data-q="1" data-r="24"><rect x="30" y="179" width="780" height="36" rx="6" fill="#e0ede3"/>
<text x="50" y="204" font-size="19" >(66, 42)</text>
<text x="240" y="204" font-size="19" >66 = 42·1 + 24</text>
<text x="555" y="204" font-size="19" >next: (42, 24)</text>
</g>
<g data-a="42" data-b="24" data-q="1" data-r="18"><rect x="30" y="222" width="780" height="36" rx="6" fill="#ffffff"/>
<text x="50" y="247" font-size="19" >(42, 24)</text>
<text x="240" y="247" font-size="19" >42 = 24·1 + 18</text>
<text x="555" y="247" font-size="19" >next: (24, 18)</text>
</g>
<g data-a="24" data-b="18" data-q="1" data-r="6"><rect x="30" y="265" width="780" height="36" rx="6" fill="#e0ede3"/>
<text x="50" y="290" font-size="19" >(24, 18)</text>
<text x="240" y="290" font-size="19" >24 = 18·1 + 6</text>
<text x="555" y="290" font-size="19" >next: (18, 6)</text>
</g>
<g data-a="18" data-b="6" data-q="3" data-r="0"><rect x="30" y="308" width="780" height="36" rx="6" fill="#ffffff"/>
<text x="50" y="333" font-size="19" >(18, 6)</text>
<text x="240" y="333" font-size="19" >18 = 6·3 + 0</text>
<text x="555" y="333" font-size="19" >next: (6, 0)</text>
</g>
<text x="30" y="387" font-size="23" font-weight="700">Final pair: (6, 0)     →     gcd(240, 174) = 6</text>
<text x="30" y="421" font-size="16" >Return the last NONZERO remainder. Zero tells the loop to stop.</text>
</g></svg>
