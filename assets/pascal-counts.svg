<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">Pascal coefficients from row zero to row six</title><desc id="desc">Each interior coefficient is the sum of its two parents. The highlighted tens in row five sum to twenty in row six.</desc>
<rect width="760" height="420" rx="16" fill="#f4f7f5"/>
<text x="380" y="35" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle" fill="#17382d" font-weight="600" >Each interior entry adds the two above it</text>
<text x="65" y="66" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" fill="#17382d" font-weight="400" >Row n</text>
<text x="65" y="90" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" fill="#17382d" font-weight="400" >0</text>
<text x="400.0" y="90" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#17382d" font-weight="400" data-n="0" data-k="0">1</text>
<text x="65" y="132" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" fill="#17382d" font-weight="400" >1</text>
<text x="364.0" y="132" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#17382d" font-weight="400" data-n="1" data-k="0">1</text>
<text x="436.0" y="132" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#17382d" font-weight="400" data-n="1" data-k="1">1</text>
<text x="65" y="174" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" fill="#17382d" font-weight="400" >2</text>
<text x="328.0" y="174" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#17382d" font-weight="400" data-n="2" data-k="0">1</text>
<text x="400.0" y="174" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#17382d" font-weight="400" data-n="2" data-k="1">2</text>
<text x="472.0" y="174" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#17382d" font-weight="400" data-n="2" data-k="2">1</text>
<text x="65" y="216" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" fill="#17382d" font-weight="400" >3</text>
<text x="292.0" y="216" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#17382d" font-weight="400" data-n="3" data-k="0">1</text>
<text x="364.0" y="216" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#17382d" font-weight="400" data-n="3" data-k="1">3</text>
<text x="436.0" y="216" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#17382d" font-weight="400" data-n="3" data-k="2">3</text>
<text x="508.0" y="216" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#17382d" font-weight="400" data-n="3" data-k="3">1</text>
<text x="65" y="258" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" fill="#17382d" font-weight="400" >4</text>
<text x="256.0" y="258" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#17382d" font-weight="400" data-n="4" data-k="0">1</text>
