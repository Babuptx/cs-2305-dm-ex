<text x="328.0" y="342" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#17382d" font-weight="400" data-n="6" data-k="2">15</text>
<circle cx="400.0" cy="336" r="22" fill="#dceee5" stroke="#28624f" stroke-width="2"/>
<text x="400.0" y="342" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#17382d" font-weight="600" data-n="6" data-k="3">20</text>
<text x="472.0" y="342" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#17382d" font-weight="400" data-n="6" data-k="4">15</text>
<text x="544.0" y="342" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#17382d" font-weight="400" data-n="6" data-k="5">6</text>
<text x="616.0" y="342" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#17382d" font-weight="400" data-n="6" data-k="6">1</text>
<path d="M 372 314 L 390 321 M 428 314 L 410 321" fill="none" stroke="#28624f" stroke-width="3"/>
<text x="400" y="395" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" fill="#17382d" font-weight="400" >C(5, 2) + C(5, 3) = 10 + 10 = 20 = C(6, 3)</text>
</svg>
