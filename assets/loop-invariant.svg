<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">Initialization, preservation, exit and termination</title><desc id="desc">Initialization establishes I at the loop head. A true guard leads to the body, which restores I and returns to the head. A false guard leads to I and not B, which imply the postcondition. A separate decreasing nonnegative integer measure proves termination.</desc>
<rect width="760" height="460" rx="16" fill="#f4f7f5"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#28624f"/></marker></defs>
<g fill="none" stroke="#28624f" stroke-width="2" marker-end="url(#arrow)"><path d="M210 96 V152"/><path d="M210 226 V292"/><path d="M385 190 H495"/><path d="M85 328 H38 V190 H70"/></g>
<g stroke="#28624f" stroke-width="2"><rect x="85" y="38" width="250" height="58" rx="10" fill="#fff"/><rect x="70" y="152" width="315" height="74" rx="10" fill="#dceee5"/><rect x="85" y="292" width="300" height="74" rx="10" fill="#fff"/><rect x="495" y="152" width="235" height="110" rx="10" fill="#fff"/></g>
<g font-family="system-ui, sans-serif" fill="#17382d" font-size="18"><text x="210" y="74" text-anchor="middle">Initialize: establish I</text><text x="227" y="180" text-anchor="middle">Loop head: I holds</text><text x="227" y="208" text-anchor="middle">Test guard B</text><text x="227" y="265">B true</text><text x="406" y="173">B false</text><text x="235" y="322" text-anchor="middle">Run the body</text><text x="235" y="350" text-anchor="middle">Restore I</text><text x="612" y="184" text-anchor="middle">At exit: I and ¬B</text><text x="612" y="216" text-anchor="middle">Together they imply</text><text x="612" y="244" text-anchor="middle">the postcondition Q.</text><text x="75" y="413">Termination: a nonnegative integer measure decreases each iteration.</text></g>
</svg>
