<svg xmlns="http://www.w3.org/2000/svg" width="840" height="390" viewBox="0 0 840 390" role="img" aria-labelledby="title desc"><title id="title">A triangular loop visits one cell per index pair</title><desc id="desc">For i from 1 to 5 and j from 1 to i, the row lengths are 1, 2, 3, 4, 5. The total is 15, equal to 5 times 6 divided by 2.</desc><rect width="840" height="390" rx="16" fill="#f4f8f4"/><g font-family="system-ui, sans-serif" fill="#193b36">
<text x="30" y="36" font-size="20" font-weight="700">Count rows before naming the growth</text>
<text x="30" y="65" font-size="16" >Each cell is one body execution at an allowed (i, j).</text>
<text x="126" y="97" font-size="13" text-anchor="middle">j=1</text>
<text x="180" y="97" font-size="13" text-anchor="middle">j=2</text>
<text x="234" y="97" font-size="13" text-anchor="middle">j=3</text>
<text x="288" y="97" font-size="13" text-anchor="middle">j=4</text>
<text x="342" y="97" font-size="13" text-anchor="middle">j=5</text>
<text x="34" y="134" font-size="15" >i=1</text>
<rect data-i="1" data-j="1" x="103" y="111" width="46" height="33" rx="5" fill="#bad9c8" stroke="#367460"/>
<text x="413" y="134" font-size="16" >1 visit</text>
<text x="34" y="177" font-size="15" >i=2</text>
<rect data-i="2" data-j="1" x="103" y="154" width="46" height="33" rx="5" fill="#bad9c8" stroke="#367460"/>
<rect data-i="2" data-j="2" x="157" y="154" width="46" height="33" rx="5" fill="#bad9c8" stroke="#367460"/>
<text x="413" y="177" font-size="16" >2 visits</text>
<text x="34" y="220" font-size="15" >i=3</text>
<rect data-i="3" data-j="1" x="103" y="197" width="46" height="33" rx="5" fill="#bad9c8" stroke="#367460"/>
<rect data-i="3" data-j="2" x="157" y="197" width="46" height="33" rx="5" fill="#bad9c8" stroke="#367460"/>
<rect data-i="3" data-j="3" x="211" y="197" width="46" height="33" rx="5" fill="#bad9c8" stroke="#367460"/>
<text x="413" y="220" font-size="16" >3 visits</text>
<text x="34" y="263" font-size="15" >i=4</text>
<rect data-i="4" data-j="1" x="103" y="240" width="46" height="33" rx="5" fill="#bad9c8" stroke="#367460"/>
<rect data-i="4" data-j="2" x="157" y="240" width="46" height="33" rx="5" fill="#bad9c8" stroke="#367460"/>
<rect data-i="4" data-j="3" x="211" y="240" width="46" height="33" rx="5" fill="#bad9c8" stroke="#367460"/>
<rect data-i="4" data-j="4" x="265" y="240" width="46" height="33" rx="5" fill="#bad9c8" stroke="#367460"/>
<text x="413" y="263" font-size="16" >4 visits</text>
<text x="34" y="306" font-size="15" >i=5</text>
<rect data-i="5" data-j="1" x="103" y="283" width="46" height="33" rx="5" fill="#bad9c8" stroke="#367460"/>
<rect data-i="5" data-j="2" x="157" y="283" width="46" height="33" rx="5" fill="#bad9c8" stroke="#367460"/>
<rect data-i="5" data-j="3" x="211" y="283" width="46" height="33" rx="5" fill="#bad9c8" stroke="#367460"/>
<rect data-i="5" data-j="4" x="265" y="283" width="46" height="33" rx="5" fill="#bad9c8" stroke="#367460"/>
<rect data-i="5" data-j="5" x="319" y="283" width="46" height="33" rx="5" fill="#bad9c8" stroke="#367460"/>
<text x="413" y="306" font-size="16" >5 visits</text>
<text x="550" y="156" font-size="20" font-weight="650">1 + 2 + 3 + 4 + 5</text>
<text x="550" y="190" font-size="20" >= 15 visits</text>
<text x="550" y="245" font-size="16" >For general n:</text>
<text x="550" y="277" font-size="19" >n(n + 1)/2 = Θ(n²)</text>
<text x="30" y="365" font-size="16" >A smaller triangular region changes the constant factor, not the quadratic order.</text>
</g></svg>
