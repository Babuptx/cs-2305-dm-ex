<svg xmlns="http://www.w3.org/2000/svg" width="840" height="455" viewBox="0 0 840 455" role="img" aria-labelledby="title desc"><title id="title">Diffie–Hellman exchange in a tiny group</title><desc id="desc">Public p=23 and g=5. Alice keeps x=6 private and sends A=8. Bob keeps y=15 private and sends B=19. Both compute shared residue 2; the bare exchange does not authenticate identity.</desc><rect width="840" height="455" rx="16" fill="#f4f8f4"/><g font-family="system-ui, sans-serif" fill="#193b36">
<text x="30" y="36" font-size="24" font-weight="700">Public parameters: p = 23, g = 5</text>
<rect x="30" y="68" width="350" height="294" rx="10" fill="#e0ede3"/>
<text x="50" y="105" font-size="24" font-weight="700">Alice</text>
<text x="50" y="143" font-size="19" >Private: x = 6</text>
<text x="50" y="183" font-size="19" >A = 5⁶ mod 23 = 8</text>
<text x="50" y="323" font-size="23" font-weight="700">19⁶ mod 23 = 2</text>
<rect x="460" y="68" width="350" height="294" rx="10" fill="#e0ede3"/>
<text x="480" y="105" font-size="24" font-weight="700">Bob</text>
<text x="480" y="143" font-size="19" >Private: y = 15</text>
<text x="480" y="183" font-size="19" >B = 5¹⁵ mod 23 = 19</text>
<text x="480" y="323" font-size="23" font-weight="700">8¹⁵ mod 23 = 2</text>
<text x="420" y="226" font-size="23" text-anchor="middle">8 →</text>
<text x="420" y="263" font-size="23" text-anchor="middle">← 19</text>
<text x="30" y="402" font-size="18" >Only A and B are exchanged. The common residue is never sent.</text>
<text x="30" y="435" font-size="17" >These tiny numbers show equality, not security or authenticated identity.</text>
</g></svg>
