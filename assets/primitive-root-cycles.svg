<svg xmlns="http://www.w3.org/2000/svg" width="840" height="365" viewBox="0 0 840 365" role="img" aria-labelledby="title desc"><title id="title">Primitive and nonprimitive power cycles modulo 13</title><desc id="desc">The powers of 2 at exponents 0 through 11 visit every nonzero residue. The powers of 3 repeat after 1,3,9, so 3 is not a primitive root.</desc><rect width="840" height="365" rx="16" fill="#f4f8f4"/><g font-family="system-ui, sans-serif" fill="#193b36">
<text x="30" y="36" font-size="21" font-weight="700">Modulo 13: does the base reach every nonzero residue?</text>
<text x="30" y="78" font-size="18" >Base 2: exponent e above; residue 2ᵉ below</text>
<g data-base="2" data-exponent="0" data-residue="1">
<text x="59" y="106" font-size="14" text-anchor="middle">0</text>
<rect x="30" y="116" width="58" height="43" rx="6" fill="#cee5d6"/>
<text x="59" y="145" font-size="21" text-anchor="middle">1</text>
</g>
<g data-base="2" data-exponent="1" data-residue="2">
<text x="124" y="106" font-size="14" text-anchor="middle">1</text>
<rect x="95" y="116" width="58" height="43" rx="6" fill="#cee5d6"/>
<text x="124" y="145" font-size="21" text-anchor="middle">2</text>
</g>
<g data-base="2" data-exponent="2" data-residue="4">
<text x="189" y="106" font-size="14" text-anchor="middle">2</text>
<rect x="160" y="116" width="58" height="43" rx="6" fill="#cee5d6"/>
<text x="189" y="145" font-size="21" text-anchor="middle">4</text>
</g>
<g data-base="2" data-exponent="3" data-residue="8">
<text x="254" y="106" font-size="14" text-anchor="middle">3</text>
<rect x="225" y="116" width="58" height="43" rx="6" fill="#cee5d6"/>
<text x="254" y="145" font-size="21" text-anchor="middle">8</text>
</g>
<g data-base="2" data-exponent="4" data-residue="3">
<text x="319" y="106" font-size="14" text-anchor="middle">4</text>
<rect x="290" y="116" width="58" height="43" rx="6" fill="#cee5d6"/>
<text x="319" y="145" font-size="21" text-anchor="middle">3</text>
</g>
<g data-base="2" data-exponent="5" data-residue="6">
<text x="384" y="106" font-size="14" text-anchor="middle">5</text>
<rect x="355" y="116" width="58" height="43" rx="6" fill="#cee5d6"/>
<text x="384" y="145" font-size="21" text-anchor="middle">6</text>
</g>
<g data-base="2" data-exponent="6" data-residue="12">
<text x="449" y="106" font-size="14" text-anchor="middle">6</text>
<rect x="420" y="116" width="58" height="43" rx="6" fill="#cee5d6"/>
<text x="449" y="145" font-size="21" text-anchor="middle">12</text>
</g>
<g data-base="2" data-exponent="7" data-residue="11">
<text x="514" y="106" font-size="14" text-anchor="middle">7</text>
<rect x="485" y="116" width="58" height="43" rx="6" fill="#cee5d6"/>
<text x="514" y="145" font-size="21" text-anchor="middle">11</text>
</g>
<g data-base="2" data-exponent="8" data-residue="9">
<text x="579" y="106" font-size="14" text-anchor="middle">8</text>
<rect x="550" y="116" width="58" height="43" rx="6" fill="#cee5d6"/>
<text x="579" y="145" font-size="21" text-anchor="middle">9</text>
</g>
<g data-base="2" data-exponent="9" data-residue="5">
<text x="644" y="106" font-size="14" text-anchor="middle">9</text>
<rect x="615" y="116" width="58" height="43" rx="6" fill="#cee5d6"/>
<text x="644" y="145" font-size="21" text-anchor="middle">5</text>
</g>
<g data-base="2" data-exponent="10" data-residue="10">
<text x="709" y="106" font-size="14" text-anchor="middle">10</text>
<rect x="680" y="116" width="58" height="43" rx="6" fill="#cee5d6"/>
<text x="709" y="145" font-size="21" text-anchor="middle">10</text>
</g>
<g data-base="2" data-exponent="11" data-residue="7">
<text x="774" y="106" font-size="14" text-anchor="middle">11</text>
<rect x="745" y="116" width="58" height="43" rx="6" fill="#cee5d6"/>
<text x="774" y="145" font-size="21" text-anchor="middle">7</text>
</g>
<text x="30" y="188" font-size="17" >At e = 12, return to 1. Cycle length 12 = p − 1: primitive.</text>
<text x="30" y="230" font-size="19" font-weight="700">Base 3:</text>
<rect x="145" y="207" width="70" height="40" rx="6" fill="#e1e9e2"/>
<text x="180" y="235" font-size="20" text-anchor="middle">1</text>
<text x="240" y="234" font-size="23" text-anchor="middle">→</text>
<rect x="265" y="207" width="70" height="40" rx="6" fill="#e1e9e2"/>
<text x="300" y="235" font-size="20" text-anchor="middle">3</text>
<text x="360" y="234" font-size="23" text-anchor="middle">→</text>
<rect x="385" y="207" width="70" height="40" rx="6" fill="#e1e9e2"/>
<text x="420" y="235" font-size="20" text-anchor="middle">9</text>
<text x="480" y="234" font-size="23" text-anchor="middle">→</text>
<rect x="505" y="207" width="70" height="40" rx="6" fill="#e1e9e2"/>
<text x="540" y="235" font-size="20" text-anchor="middle">1</text>
<text x="30" y="288" font-size="18" >Cycle length 3: only 1, 3, 9 are reached. Base 3 is not primitive.</text>
<text x="30" y="331" font-size="17" >Use exponents 0 ≤ e &lt; p − 1 for a unique logarithm to a primitive base.</text>
</g></svg>
