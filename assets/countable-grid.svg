<svg xmlns="http://www.w3.org/2000/svg" width="840" height="492" viewBox="0 0 840 492" role="img" aria-labelledby="title desc">
<title id="title">Listing positive integer pairs by diagonals</title>
<desc id="desc">Columns represent p and rows q. Cell positions increase along diagonals of constant p plus q, starting 1 at (1,1), 2 at (1,2), and 3 at (2,1). Shading groups the first five diagonals.</desc>
<rect width="840" height="492" rx="16" fill="#f5f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#17324d">
<text x="420" y="36" font-size="23" font-weight="700" text-anchor="middle">Finite diagonals reach every positive pair</text>
<text x="420" y="66" font-size="16" font-weight="400" text-anchor="middle">Cell labels give the position in the listing, not p/q.</text>
<text x="440" y="105" font-size="18" font-weight="600" text-anchor="middle">p (first coordinate)</text>
<text x="25" y="260" font-size="18" font-weight="600" text-anchor="middle">q</text>
<text x="255" y="140" font-size="18" font-weight="600" text-anchor="middle">1</text>
<text x="360" y="140" font-size="18" font-weight="600" text-anchor="middle">2</text>
<text x="465" y="140" font-size="18" font-weight="600" text-anchor="middle">3</text>
<text x="570" y="140" font-size="18" font-weight="600" text-anchor="middle">4</text>
<text x="675" y="140" font-size="18" font-weight="600" text-anchor="middle">5</text>
<text x="137" y="189" font-size="18" font-weight="600" text-anchor="middle">1</text>
<g data-p="1" data-q="1" data-position="1">
<rect x="215" y="157" width="80" height="42" rx="7" fill="#e0f0e9" stroke="#aabcca"/>
<text x="255" y="185" font-size="21" font-weight="600" text-anchor="middle">1</text>
</g>
<g data-p="2" data-q="1" data-position="3">
<rect x="320" y="157" width="80" height="42" rx="7" fill="#eaf3ff" stroke="#aabcca"/>
<text x="360" y="185" font-size="21" font-weight="600" text-anchor="middle">3</text>
</g>
<g data-p="3" data-q="1" data-position="6">
<rect x="425" y="157" width="80" height="42" rx="7" fill="#fff4de" stroke="#aabcca"/>
<text x="465" y="185" font-size="21" font-weight="600" text-anchor="middle">6</text>
