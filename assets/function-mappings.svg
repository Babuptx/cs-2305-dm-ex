<svg xmlns="http://www.w3.org/2000/svg" width="840" height="735" viewBox="0 0 840 735" role="img" aria-labelledby="title desc">
<title id="title">Four types of functions</title><desc id="desc">Four finite mappings match the lesson table. Output lists are 1,2,3 into four targets; 1,2,2,3 into three; 2,3,1 into three; and 1,1,2 into three. Every input has one outgoing arrow.</desc>
<rect width="840" height="735" rx="16" fill="#f5f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#17324d">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#397d70"/></marker></defs><text x="420" y="34" font-size="23" font-weight="700" text-anchor="middle">Every input has one outgoing arrow</text><text x="420" y="62" font-size="16" font-weight="400" text-anchor="middle">Classify a function by the arrows arriving at its targets.</text><g transform="translate(25 88)" data-outputs="1,2,3" data-codomain-size="4"><rect width="380" height="280" rx="12" fill="white" stroke="#b8c8d5"/><text x="190" y="28" font-size="20" font-weight="600" text-anchor="middle">Injective, not onto</text><text x="55" y="57" font-size="15" font-weight="400" text-anchor="middle">Inputs</text><text x="310" y="57" font-size="15" font-weight="400" text-anchor="middle">Targets</text><line x1="72" y1="114" x2="286" y2="93" stroke="#397d70" stroke-width="2" marker-end="url(#arrow)"/><line x1="72" y1="156" x2="286" y2="135" stroke="#397d70" stroke-width="2" marker-end="url(#arrow)"/><line x1="72" y1="198" x2="286" y2="177" stroke="#397d70" stroke-width="2" marker-end="url(#arrow)"/><circle cx="55" cy="114" r="17" fill="#eaf3ff" stroke="#356b9d"/><text x="55" y="120" font-size="17" font-weight="400" text-anchor="middle">a</text><circle cx="55" cy="156" r="17" fill="#eaf3ff" stroke="#356b9d"/><text x="55" y="162" font-size="17" font-weight="400" text-anchor="middle">b</text><circle cx="55" cy="198" r="17" fill="#eaf3ff" stroke="#356b9d"/><text x="55" y="204" font-size="17" font-weight="400" text-anchor="middle">c</text><circle cx="310" cy="93" r="17" fill="#fff4de" stroke="#996b26"/><text x="310" y="99" font-size="17" font-weight="400" text-anchor="middle">1</text><circle cx="310" cy="135" r="17" fill="#fff4de" stroke="#996b26"/><text x="310" y="141" font-size="17" font-weight="400" text-anchor="middle">2</text><circle cx="310" cy="177" r="17" fill="#fff4de" stroke="#996b26"/><text x="310" y="183" font-size="17" font-weight="400" text-anchor="middle">3</text><circle cx="310" cy="219" r="17" fill="#fff4de" stroke="#996b26"/><text x="310" y="225" font-size="17" font-weight="400" text-anchor="middle">4</text><text x="190" y="260" font-size="15" font-weight="400" text-anchor="middle">No collisions; target 4 is missed.</text></g><g transform="translate(435 88)" data-outputs="1,2,2,3" data-codomain-size="3"><rect width="380" height="280" rx="12" fill="white" stroke="#b8c8d5"/><text x="190" y="28" font-size="20" font-weight="600" text-anchor="middle">Onto, not injective</text><text x="55" y="57" font-size="15" font-weight="400" text-anchor="middle">Inputs</text><text x="310" y="57" font-size="15" font-weight="400" text-anchor="middle">Targets</text><line x1="72" y1="93" x2="286" y2="114" stroke="#397d70" stroke-width="2" marker-end="url(#arrow)"/><line x1="72" y1="135" x2="286" y2="156" stroke="#397d70" stroke-width="2" marker-end="url(#arrow)"/><line x1="72" y1="177" x2="286" y2="156" stroke="#397d70" stroke-width="2" marker-end="url(#arrow)"/><line x1="72" y1="219" x2="286" y2="198" stroke="#397d70" stroke-width="2" marker-end="url(#arrow)"/><circle cx="55" cy="93" r="17" fill="#eaf3ff" stroke="#356b9d"/><text x="55" y="99" font-size="17" font-weight="400" text-anchor="middle">a</text><circle cx="55" cy="135" r="17" fill="#eaf3ff" stroke="#356b9d"/><text x="55" y="141" font-size="17" font-weight="400" text-anchor="middle">b</text><circle cx="55" cy="177" r="17" fill="#eaf3ff" stroke="#356b9d"/><text x="55" y="183" font-size="17" font-weight="400" text-anchor="middle">c</text><circle cx="55" cy="219" r="17" fill="#eaf3ff" stroke="#356b9d"/><text x="55" y="225" font-size="17" font-weight="400" text-anchor="middle">d</text><circle cx="310" cy="114" r="17" fill="#fff4de" stroke="#996b26"/><text x="310" y="120" font-size="17" font-weight="400" text-anchor="middle">1</text><circle cx="310" cy="156" r="17" fill="#fff4de" stroke="#996b26"/><text x="310" y="162" font-size="17" font-weight="400" text-anchor="middle">2</text><circle cx="310" cy="198" r="17" fill="#fff4de" stroke="#996b26"/><text x="310" y="204" font-size="17" font-weight="400" text-anchor="middle">3</text><text x="190" y="260" font-size="15" font-weight="400" text-anchor="middle">Every target is hit; target 2 is shared.</text></g><g transform="translate(25 388)" data-outputs="2,3,1" data-codomain-size="3"><rect width="380" height="280" rx="12" fill="white" stroke="#b8c8d5"/><text x="190" y="28" font-size="20" font-weight="600" text-anchor="middle">Bijective</text><text x="55" y="57" font-size="15" font-weight="400" text-anchor="middle">Inputs</text><text x="310" y="57" font-size="15" font-weight="400" text-anchor="middle">Targets</text><line x1="72" y1="114" x2="286" y2="156" stroke="#397d70" stroke-width="2" marker-end="url(#arrow)"/><line x1="72" y1="156" x2="286" y2="198" stroke="#397d70" stroke-width="2" marker-end="url(#arrow)"/><line x1="72" y1="198" x2="286" y2="114" stroke="#397d70" stroke-width="2" marker-end="url(#arrow)"/><circle cx="55" cy="114" r="17" fill="#eaf3ff" stroke="#356b9d"/><text x="55" y="120" font-size="17" font-weight="400" text-anchor="middle">a</text><circle cx="55" cy="156" r="17" fill="#eaf3ff" stroke="#356b9d"/><text x="55" y="162" font-size="17" font-weight="400" text-anchor="middle">b</text><circle cx="55" cy="198" r="17" fill="#eaf3ff" stroke="#356b9d"/><text x="55" y="204" font-size="17" font-weight="400" text-anchor="middle">c</text><circle cx="310" cy="114" r="17" fill="#fff4de" stroke="#996b26"/><text x="310" y="120" font-size="17" font-weight="400" text-anchor="middle">1</text><circle cx="310" cy="156" r="17" fill="#fff4de" stroke="#996b26"/><text x="310" y="162" font-size="17" font-weight="400" text-anchor="middle">2</text><circle cx="310" cy="198" r="17" fill="#fff4de" stroke="#996b26"/><text x="310" y="204" font-size="17" font-weight="400" text-anchor="middle">3</text><text x="190" y="260" font-size="15" font-weight="400" text-anchor="middle">Exactly one preimage per target.</text></g><g transform="translate(435 388)" data-outputs="1,1,2" data-codomain-size="3"><rect width="380" height="280" rx="12" fill="white" stroke="#b8c8d5"/><text x="190" y="28" font-size="20" font-weight="600" text-anchor="middle">Neither</text><text x="55" y="57" font-size="15" font-weight="400" text-anchor="middle">Inputs</text><text x="310" y="57" font-size="15" font-weight="400" text-anchor="middle">Targets</text><line x1="72" y1="114" x2="286" y2="114" stroke="#397d70" stroke-width="2" marker-end="url(#arrow)"/><line x1="72" y1="156" x2="286" y2="114" stroke="#397d70" stroke-width="2" marker-end="url(#arrow)"/><line x1="72" y1="198" x2="286" y2="156" stroke="#397d70" stroke-width="2" marker-end="url(#arrow)"/><circle cx="55" cy="114" r="17" fill="#eaf3ff" stroke="#356b9d"/><text x="55" y="120" font-size="17" font-weight="400" text-anchor="middle">a</text><circle cx="55" cy="156" r="17" fill="#eaf3ff" stroke="#356b9d"/><text x="55" y="162" font-size="17" font-weight="400" text-anchor="middle">b</text><circle cx="55" cy="198" r="17" fill="#eaf3ff" stroke="#356b9d"/><text x="55" y="204" font-size="17" font-weight="400" text-anchor="middle">c</text><circle cx="310" cy="114" r="17" fill="#fff4de" stroke="#996b26"/><text x="310" y="120" font-size="17" font-weight="400" text-anchor="middle">1</text><circle cx="310" cy="156" r="17" fill="#fff4de" stroke="#996b26"/><text x="310" y="162" font-size="17" font-weight="400" text-anchor="middle">2</text><circle cx="310" cy="198" r="17" fill="#fff4de" stroke="#996b26"/><text x="310" y="204" font-size="17" font-weight="400" text-anchor="middle">3</text><text x="190" y="260" font-size="15" font-weight="400" text-anchor="middle">Target 1 is shared; target 3 is missed.</text></g><text x="420" y="710" font-size="17" font-weight="600" text-anchor="middle">One-to-one: no shared targets. Onto: no missed targets.</text>
</g></svg>
