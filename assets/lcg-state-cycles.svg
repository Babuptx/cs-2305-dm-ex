<svg xmlns="http://www.w3.org/2000/svg" width="840" height="405" viewBox="0 0 840 405" role="img" aria-labelledby="title desc"><title id="title">A cycle may begin after the seed</title><desc id="desc">With modulus 16, multiplier 5, increment 1, seed 3, all 16 states occur before returning to 3. With modulus 8, multiplier 4, increment 0, seed 3, the sequence reaches the cycle at 0 after two steps.</desc><rect width="840" height="405" rx="16" fill="#f4f8f4"/><g font-family="system-ui, sans-serif" fill="#193b36">
<text x="30" y="36" font-size="23" font-weight="700">Repetition is guaranteed; a full-length cycle is not</text>
<text x="30" y="78" font-size="19" >xₙ₊₁ = (5xₙ + 1) mod 16, seed 3</text>
<g data-step="0" data-state="3"><rect x="30" y="100" width="76" height="39" rx="6" fill="#cee5d6"/>
<text x="68" y="127" font-size="21" text-anchor="middle">3</text>
<text x="116" y="127" font-size="18" text-anchor="middle">→</text>
</g>
<g data-step="1" data-state="0"><rect x="128" y="100" width="76" height="39" rx="6" fill="#cee5d6"/>
<text x="166" y="127" font-size="21" text-anchor="middle">0</text>
<text x="214" y="127" font-size="18" text-anchor="middle">→</text>
</g>
<g data-step="2" data-state="1"><rect x="226" y="100" width="76" height="39" rx="6" fill="#cee5d6"/>
<text x="264" y="127" font-size="21" text-anchor="middle">1</text>
<text x="312" y="127" font-size="18" text-anchor="middle">→</text>
</g>
<g data-step="3" data-state="6"><rect x="324" y="100" width="76" height="39" rx="6" fill="#cee5d6"/>
<text x="362" y="127" font-size="21" text-anchor="middle">6</text>
<text x="410" y="127" font-size="18" text-anchor="middle">→</text>
</g>
<g data-step="4" data-state="15"><rect x="422" y="100" width="76" height="39" rx="6" fill="#cee5d6"/>
<text x="460" y="127" font-size="21" text-anchor="middle">15</text>
<text x="508" y="127" font-size="18" text-anchor="middle">→</text>
</g>
<g data-step="5" data-state="12"><rect x="520" y="100" width="76" height="39" rx="6" fill="#cee5d6"/>
<text x="558" y="127" font-size="21" text-anchor="middle">12</text>
<text x="606" y="127" font-size="18" text-anchor="middle">→</text>
</g>
<g data-step="6" data-state="13"><rect x="618" y="100" width="76" height="39" rx="6" fill="#cee5d6"/>
<text x="656" y="127" font-size="21" text-anchor="middle">13</text>
<text x="704" y="127" font-size="18" text-anchor="middle">→</text>
</g>
<g data-step="7" data-state="2"><rect x="716" y="100" width="76" height="39" rx="6" fill="#cee5d6"/>
<text x="754" y="127" font-size="21" text-anchor="middle">2</text>
<text x="802" y="127" font-size="18" text-anchor="middle">→</text>
</g>
<g data-step="8" data-state="11"><rect x="30" y="157" width="76" height="39" rx="6" fill="#cee5d6"/>
<text x="68" y="184" font-size="21" text-anchor="middle">11</text>
<text x="116" y="184" font-size="18" text-anchor="middle">→</text>
</g>
<g data-step="9" data-state="8"><rect x="128" y="157" width="76" height="39" rx="6" fill="#cee5d6"/>
<text x="166" y="184" font-size="21" text-anchor="middle">8</text>
<text x="214" y="184" font-size="18" text-anchor="middle">→</text>
</g>
<g data-step="10" data-state="9"><rect x="226" y="157" width="76" height="39" rx="6" fill="#cee5d6"/>
<text x="264" y="184" font-size="21" text-anchor="middle">9</text>
<text x="312" y="184" font-size="18" text-anchor="middle">→</text>
</g>
<g data-step="11" data-state="14"><rect x="324" y="157" width="76" height="39" rx="6" fill="#cee5d6"/>
<text x="362" y="184" font-size="21" text-anchor="middle">14</text>
<text x="410" y="184" font-size="18" text-anchor="middle">→</text>
</g>
<g data-step="12" data-state="7"><rect x="422" y="157" width="76" height="39" rx="6" fill="#cee5d6"/>
<text x="460" y="184" font-size="21" text-anchor="middle">7</text>
<text x="508" y="184" font-size="18" text-anchor="middle">→</text>
</g>
<g data-step="13" data-state="4"><rect x="520" y="157" width="76" height="39" rx="6" fill="#cee5d6"/>
<text x="558" y="184" font-size="21" text-anchor="middle">4</text>
<text x="606" y="184" font-size="18" text-anchor="middle">→</text>
</g>
<g data-step="14" data-state="5"><rect x="618" y="157" width="76" height="39" rx="6" fill="#cee5d6"/>
<text x="656" y="184" font-size="21" text-anchor="middle">5</text>
<text x="704" y="184" font-size="18" text-anchor="middle">→</text>
</g>
<g data-step="15" data-state="10"><rect x="716" y="157" width="76" height="39" rx="6" fill="#cee5d6"/>
<text x="754" y="184" font-size="21" text-anchor="middle">10</text>
<text x="802" y="184" font-size="18" text-anchor="middle">↩</text>
</g>
<text x="30" y="228" font-size="17" >Read across each row. After 10, the next state is the seed 3. Period: 16.</text>
<text x="30" y="277" font-size="19" >xₙ₊₁ = 4xₙ mod 8, seed 3</text>
<text x="30" y="321" font-size="25" font-weight="650">3  →  4  →  0  →  0  →  0  → …</text>
<text x="30" y="368" font-size="18" >Two steps reach the cycle; its period is 1. The seed never returns.</text>
</g></svg>
