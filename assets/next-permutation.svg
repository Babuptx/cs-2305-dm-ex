<text x="426.5" y="106" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle" font-weight="600" fill="#17382d">1</text>
<rect x="473" y="74" width="59" height="49" rx="9" fill="#fff" stroke="#28624f"/>
<text x="502.5" y="106" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle" font-weight="600" fill="#17382d">6</text>
<rect x="549" y="74" width="59" height="49" rx="9" fill="#fff" stroke="#28624f"/>
<text x="578.5" y="106" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle" font-weight="600" fill="#17382d">5</text>
<rect x="625" y="74" width="59" height="49" rx="9" fill="#fff" stroke="#28624f"/>
<text x="654.5" y="106" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle" font-weight="600" fill="#17382d">3</text>
<text x="32" y="181" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#17382d">Swap 1 and 3</text>
