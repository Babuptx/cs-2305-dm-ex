<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">The next permutation: preserve, swap, reverse</title><desc id="desc">The initial list 2, 4, 1, 6, 5, 3 has pivot 1. Swapping with 3 gives 2, 4, 3, 6, 5, 1. Reversing the last three entries gives 2, 4, 3, 1, 5, 6.</desc>
