<rect x="397" y="150" width="59" height="49" rx="9" fill="#dceee5" stroke="#28624f"/>
<text x="426.5" y="182" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle" font-weight="600" fill="#17382d">3</text>
