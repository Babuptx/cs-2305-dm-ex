<text x="380" y="35" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle" font-weight="600" fill="#17382d">The next permutation: preserve, swap, reverse</text>
<text x="32" y="105" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#17382d">Pivot: 1</text>
<rect x="245" y="74" width="59" height="49" rx="9" fill="#fff" stroke="#28624f"/>
<text x="274.5" y="106" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle" font-weight="600" fill="#17382d">2</text>
<rect x="321" y="74" width="59" height="49" rx="9" fill="#fff" stroke="#28624f"/>
<text x="350.5" y="106" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle" font-weight="600" fill="#17382d">4</text>
