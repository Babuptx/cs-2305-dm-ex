<svg xmlns="http://www.w3.org/2000/svg" width="840" height="375" viewBox="0 0 840 375" role="img" aria-labelledby="title desc">
<title id="title">Reindexing a finite sum</title><desc id="desc">Old indices 3,4,5,6 pair with new indices 0,1,2,3. Their summands remain 9,16,25,36 and sum to 86. Changing the bounds must also change j squared to k plus 3 squared.</desc>
<rect width="840" height="375" rx="16" fill="#f5f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#17324d">
<text x="420" y="36" font-size="23" font-weight="700" text-anchor="middle">New index labels, identical terms</text><text x="420" y="65" font-size="18" font-weight="400" text-anchor="middle">Set k = j − 3, so j = k + 3.</text><text x="28" y="124" font-size="17" font-weight="600" text-anchor="start">Old index j</text><text x="28" y="204" font-size="17" font-weight="600" text-anchor="start">New index k</text><text x="28" y="289" font-size="17" font-weight="600" text-anchor="start">Term value</text><g data-old="3" data-new="0" data-value="9"><rect x="190" y="100" width="90" height="40" rx="8" fill="#eaf3ff" stroke="#9fb3c5"/><text x="235" y="127" font-size="21" font-weight="600" text-anchor="middle">3</text><rect x="190" y="180" width="90" height="40" rx="8" fill="#eaf3ff" stroke="#9fb3c5"/><text x="235" y="207" font-size="21" font-weight="600" text-anchor="middle">0</text><rect x="190" y="265" width="90" height="40" rx="8" fill="#fff4de" stroke="#9fb3c5"/><text x="235" y="292" font-size="21" font-weight="600" text-anchor="middle">9</text><path d="M 235 143 v 30 m -5 -6 l 5 6 l 5 -6 M 235 223 v 34 m -5 -6 l 5 6 l 5 -6" fill="none" stroke="#397d70" stroke-width="2"/></g><g data-old="4" data-new="1" data-value="16"><rect x="345" y="100" width="90" height="40" rx="8" fill="#eaf3ff" stroke="#9fb3c5"/><text x="390" y="127" font-size="21" font-weight="600" text-anchor="middle">4</text><rect x="345" y="180" width="90" height="40" rx="8" fill="#eaf3ff" stroke="#9fb3c5"/><text x="390" y="207" font-size="21" font-weight="600" text-anchor="middle">1</text><rect x="345" y="265" width="90" height="40" rx="8" fill="#fff4de" stroke="#9fb3c5"/><text x="390" y="292" font-size="21" font-weight="600" text-anchor="middle">16</text><path d="M 390 143 v 30 m -5 -6 l 5 6 l 5 -6 M 390 223 v 34 m -5 -6 l 5 6 l 5 -6" fill="none" stroke="#397d70" stroke-width="2"/></g><g data-old="5" data-new="2" data-value="25"><rect x="500" y="100" width="90" height="40" rx="8" fill="#eaf3ff" stroke="#9fb3c5"/><text x="545" y="127" font-size="21" font-weight="600" text-anchor="middle">5</text><rect x="500" y="180" width="90" height="40" rx="8" fill="#eaf3ff" stroke="#9fb3c5"/><text x="545" y="207" font-size="21" font-weight="600" text-anchor="middle">2</text><rect x="500" y="265" width="90" height="40" rx="8" fill="#fff4de" stroke="#9fb3c5"/><text x="545" y="292" font-size="21" font-weight="600" text-anchor="middle">25</text><path d="M 545 143 v 30 m -5 -6 l 5 6 l 5 -6 M 545 223 v 34 m -5 -6 l 5 6 l 5 -6" fill="none" stroke="#397d70" stroke-width="2"/></g><g data-old="6" data-new="3" data-value="36"><rect x="655" y="100" width="90" height="40" rx="8" fill="#eaf3ff" stroke="#9fb3c5"/><text x="700" y="127" font-size="21" font-weight="600" text-anchor="middle">6</text><rect x="655" y="180" width="90" height="40" rx="8" fill="#eaf3ff" stroke="#9fb3c5"/><text x="700" y="207" font-size="21" font-weight="600" text-anchor="middle">3</text><rect x="655" y="265" width="90" height="40" rx="8" fill="#fff4de" stroke="#9fb3c5"/><text x="700" y="292" font-size="21" font-weight="600" text-anchor="middle">36</text><path d="M 700 143 v 30 m -5 -6 l 5 6 l 5 -6 M 700 223 v 34 m -5 -6 l 5 6 l 5 -6" fill="none" stroke="#397d70" stroke-width="2"/></g><text x="420" y="343" font-size="20" font-weight="600" text-anchor="middle">Σⱼ₌₃⁶ j² = Σₖ₌₀³ (k + 3)² = 9 + 16 + 25 + 36 = 86</text>
</g></svg>
