<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">Bit strings of length three without adjacent ones</title><desc id="desc">The root is empty. First-bit branches are 0 and 1. Second-bit prefixes are 00, 01, and 10. The five length-three leaves are 000, 001, 010, 100, and 101.</desc>
<rect width="760" height="420" rx="16" fill="#f4f7f5"/>
<g stroke="#597369" stroke-width="2" fill="none"><path d="M75 208 L215 130 M75 208 L215 296 M215 130 L405 84 M215 130 L405 190 M215 296 L405 302 M405 84 L645 58 M405 84 L645 124 M405 190 L645 190 M405 302 L645 266 M405 302 L645 338"/></g>
<g stroke="#28624f" stroke-width="2" fill="#fff"><rect x="38" y="188" width="74" height="40" rx="8"/><rect x="188" y="110" width="54" height="40" rx="8"/><rect x="188" y="276" width="54" height="40" rx="8"/><rect x="370" y="64" width="70" height="40" rx="8"/><rect x="370" y="170" width="70" height="40" rx="8"/><rect x="370" y="282" width="70" height="40" rx="8"/></g>
<g stroke="#28624f" stroke-width="2" fill="#dceee5"><rect x="600" y="38" width="90" height="40" rx="8"/><rect x="600" y="104" width="90" height="40" rx="8"/><rect x="600" y="170" width="90" height="40" rx="8"/><rect x="600" y="246" width="90" height="40" rx="8"/><rect x="600" y="318" width="90" height="40" rx="8"/></g>
<g font-family="system-ui, sans-serif" fill="#17382d" font-size="19" text-anchor="middle"><text x="75" y="215">empty</text><text x="215" y="137">0</text><text x="215" y="303">1</text><text x="405" y="91">00</text><text x="405" y="197">01</text><text x="405" y="309">10</text><text x="645" y="65">000</text><text x="645" y="131">001</text><text x="645" y="197">010</text><text x="645" y="273">100</text><text x="645" y="345">101</text></g>
<g font-family="system-ui, sans-serif" fill="#17382d" font-size="16" text-anchor="middle"><text x="215" y="26">1 bit</text><text x="405" y="26">2 bits</text><text x="645" y="26">3 bits: 5 leaves</text><text x="380" y="394">After a 1, only 0 may be appended. Count completed paths.</text></g>
</svg>
